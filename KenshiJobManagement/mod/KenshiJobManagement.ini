; Kenshi Job Management (LEOPARD fork) - настройки плагина.
; Удобнее менять во вкладке MCM окна "Настройки" игры (мод ModConfigMenu).
; Состояние окна (фильтры станций, свёрнутые группы) хранится отдельно:
; %LOCALAPPDATA%\KenshiJobManagement\settings.ini.

[General]

; 0 - мод выключен целиком (после перезапуска игры).
Enabled=1

; Клавиша окна (CTRL+J, ALT+J, F6, ...); NONE - только кнопка на панели.
Hotkey=CTRL+J

; Кнопка JM рядом с кнопкой "Работа" на нижней панели игры.
HudButton=1
